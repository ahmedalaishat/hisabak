name: Distribute staging

# Builds the staging variant and pushes it to Firebase App Distribution (the "qa" testers
# group). Runs on every push to develop, and on demand. Production goes to Play separately.
on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  distribute:
    name: Staging → Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build staging release APK
        # See release.yml: blank parse-service config hides every online-AI affordance.
        env:
          HISABAK_PARSE_URL: ${{ secrets.HISABAK_PARSE_URL }}
          HISABAK_PARSE_TOKEN: ${{ secrets.HISABAK_PARSE_TOKEN }}
        run: ./gradlew assembleStagingRelease --no-daemon

      # Firebase caps release notes and rejects an over-long body with a 400 *after* the binary
      # has uploaded — so the build goes red while the testers already have the APK, which reads
      # like a failed distribution. Squash merges make this the normal case rather than an edge
      # one: the squash body concatenates every commit message on the branch, so the note grows
      # with branch length and any branch of more than a couple of commits breaches the limit.
      # Keep the subject and as much body as fits.
      - name: Compose release notes
        env:
          # Through env rather than direct interpolation: a commit message is untrusted input
          # and would otherwise be spliced into the shell.
          MSG: ${{ github.event.head_commit.message || format('Manual staging build {0}', github.sha) }}
        run: |
          python3 -c 'import os; m = os.environ["MSG"].strip(); lim = 900; print(m if len(m) <= lim else m[:lim].rstrip() + "\u2026")' > release-notes.txt
          echo "Release notes: $(wc -m < release-notes.txt | tr -d ' ') chars"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          # Staging Firebase app id (com.hisabak.staging) — not a secret; it ships in the APK.
          appId: 1:469916556187:android:bb6a22afa66dde1b80df3e
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: qa
          file: androidApp/build/outputs/apk/staging/release/androidApp-staging-release.apk
          releaseNotesFile: release-notes.txt
